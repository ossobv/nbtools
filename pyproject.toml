[build-system]
requires = ["setuptools>=61.0"]  # XXX
build-backend = "setuptools.build_meta"

[project]
name = "nbtools"
version = "0.1.0"
description = "Tooling for netbox, think lint/sync/dig"
readme = "README.rst"
requires-python = ">=3.8"       # XXX
license = { text = "GPL3+" }    # XXX
authors = [
  { name = "Walter Doekes", email = "wjdoekes+nbtools@osso.nl" },
]

dependencies = [
  "pynetbox",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "responses",
]

[project.scripts]
nblint = "nbtools.lint:main"
nbsync = "nbtools.sync:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
