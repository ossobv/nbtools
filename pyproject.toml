[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools-scm>=8.0"
]
build-backend = "setuptools.build_meta"

[project]
#name = "nbtools"  # alas, nbtools/nblint/nbsync all taken on PyPI
name = "netbox-tools"
dynamic = ["version"]
description = "Tooling for netbox, think lint/sync/dig"
readme = "README.rst"
requires-python = ">=3.8"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Walter Doekes", email = "wjdoekes+nbtools@osso.nl" },
]

dependencies = [
  "pynetbox",
  # Both come in with pynetbox, but netbox.py imports them itself: the
  # retrying session is a requests adapter around a urllib3 Retry, and
  # backoff_jitter is urllib3 2.x only.
  "requests",
  "urllib3>=2",
]

[project.optional-dependencies]
dev = [
  "flake8",
  "pytest",
  "responses",
]

[project.scripts]
nblint = "nbtools.lint:main"
nbsync = "nbtools.sync:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]  # activates setuptools_scm
#version_file = "nbtools/_version.py"
