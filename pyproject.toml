[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools-scm>=8.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "nbtools"
dynamic = ["version"]
description = "Tooling for netbox, think lint/sync/dig"
readme = "README.rst"
requires-python = ">=3.8"       # XXX
license = { text = "GPL3+" }    # XXX
authors = [
  { name = "Walter Doekes", email = "wjdoekes+nbtools@osso.nl" },
]

dependencies = [
  "pynetbox",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "responses",
]

[project.scripts]
nblint = "nbtools.lint:main"
nbsync = "nbtools.sync:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]  # activates setuptools_scm
#version_file = "nbtools/_version.py"
